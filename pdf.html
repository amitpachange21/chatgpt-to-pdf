<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT PDF Preview</title>
  <link rel="stylesheet" href="pdf.css">
</head>
<body>
  <div class="toolbar no-print">
    <div class="toolbar-inner">
      <div class="title-group">
        <span class="toolbar-label">PDF Preview</span>
        <span id="chatTitle" class="chat-title"></span>
      </div>
      <div class="toolbar-actions">
        <button id="printBtn" class="btn-secondary">Print / Save as PDF</button>
        <button id="downloadBtn" class="btn-primary">Download exact PDF</button>
      </div>
    </div>
  </div>

  <div class="page">
    <header class="doc-header">
      <h1 id="docTitle">ChatGPT Conversation</h1>
      <p id="docUrl" class="doc-url"></p>
    </header>
    <div id="conversation" class="conversation"></div>
  </div>

  <script src="libs/html2canvas.min.js"></script>
  <script src="libs/jspdf.umd.min.js"></script>
  <script src="libs/prism/prism.min.js" data-manual></script>
  <script src="libs/prism/prism-java.min.js"></script>
  <script src="libs/prism/prism-sql.min.js"></script>
  <script src="libs/prism/prism-python.min.js"></script>
  <script src="libs/prism/prism-typescript.min.js"></script>
  <script src="libs/prism/prism-json.min.js"></script>
  <script src="libs/prism/prism-bash.min.js"></script>
  <script src="libs/prism/prism-csharp.min.js"></script>
  <script src="libs/prism/prism-c.min.js"></script>
  <script src="libs/prism/prism-cpp.min.js"></script>
  <script src="libs/prism/prism-go.min.js"></script>
  <script src="libs/prism/prism-rust.min.js"></script>
  <script src="libs/prism/prism-yaml.min.js"></script>
  <script src="libs/prism/prism-markdown.min.js"></script>
  <script src="pdf.js"></script>
</body>
</html>
