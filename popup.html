<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT to PDF</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="logo-row">
      <div class="logo">PDF</div>
      <h1>ChatGPT to PDF</h1>
    </div>
    <p class="subtitle">Export any loaded ChatGPT conversation to PDF.</p>
    <button id="exportBtn" class="btn-primary">Export Chat</button>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div class="hint">Open ChatGPT, scroll to load the messages you want, then click Export.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
